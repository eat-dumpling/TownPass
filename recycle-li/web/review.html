<!doctype html>
<html><head><meta charset="utf-8"><title>photo review</title>
<!-- 驗證照片的目視檢查（只在 vite.eval.config.ts 的建置裡）：每個品項一列，搜錯的照片標題寫進 data/commons_hand_reject.txt -->
<style>
  body { font: 12px sans-serif; margin: 8px; background: #fff; color: #111; }
  h2 { font-size: 14px; margin: 10px 0 4px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  figure { margin: 0; width: var(--px, 150px); }
  img { width: var(--px, 150px); height: var(--px, 150px); object-fit: cover; display: block; }
  figcaption { font-size: 10px; line-height: 1.2; height: 2.4em; overflow: hidden; }
</style></head>
<body><div id="out"></div>
<script type="module">
  const q = new URLSearchParams(location.search)
  const only = q.get('only')?.split(',')
  const files = q.get('files')?.split(',')
  const px = Number(q.get('s') ?? 150) // 縮圖大小（一次看比較多張時用小一點）
  document.documentElement.style.setProperty('--px', `${px}px`)
  const m = await (await fetch('./_eval/manifest.json')).json()
  const by = {}
  for (const x of m) if ((!only || only.includes(x.item)) && (!files || files.includes(x.file))) (by[x.item] ??= []).push(x)
  const out = document.getElementById('out')
  for (const [item, xs] of Object.entries(by)) {
    const h = document.createElement('h2'); h.textContent = `${item} (${xs.length})`; out.append(h)
    const row = document.createElement('div'); row.className = 'row'; out.append(row)
    for (const x of xs) {
      const f = document.createElement('figure')
      const img = document.createElement('img'); img.src = `./_eval/${x.file}`; img.loading = 'eager'
      const c = document.createElement('figcaption'); c.textContent = `${x.file.split('/')[1]} ${String(x.title ?? '').slice(5, 60)}`
      f.append(img, c); row.append(f)
    }
  }
</script></body></html>

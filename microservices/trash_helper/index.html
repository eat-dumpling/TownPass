<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Taipei Trash Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="page-title" class="topbar-title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="zh">中</button>
      <button type="button" class="lang-btn" data-lang="more" aria-haspopup="dialog">···</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="lang-dialog" aria-labelledby="lang-dialog-title">
    <h2 id="lang-dialog-title"></h2>
    <ul class="lang-list" id="lang-list"></ul>
    <button type="button" class="btn btn-secondary" id="lang-close"></button>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
